name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every day at 00:00 UTC to prevent Streamlit Community Cloud from sleeping
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -L --max-time 30 https://devcore-ai.streamlit.app > /dev/null
          echo "Pinged https://devcore-ai.streamlit.app successfully at $(date)"
